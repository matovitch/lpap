# Selectable kind: train energy→image from the empirical AE energy bank.
# Load via model_kind ``energy_to_image_energy_bank``. No surrogate/decoder required.

[image]
dataset_path = "data/images_32x32_gray.pt"
batch_size = 32
side = 32
normalize = true
shuffle = true
num_workers = 0

[source]
kind = "energy_bank"

[source.energy_bank]
path = "data/encoded_energies_ae_best_131k.pt"
energies_key = "energies"

[flow]
sequence_length = 1024
width = 128
time_dim = 128
dilation_cycles = 2
dilations = [1, 2, 4, 8, 16, 32, 64, 128]
kernel_size = 3
zero_init_output = true

[time]
distribution = "beta"
beta_alpha = 0.1
beta_beta = 0.1
eps = 1.0e-4

[optimizer]
learning_rate = 1.0e-4
max_grad_norm = 1.0

[validation]
enabled = true
every = 50
batch_size = 64
seed = 40123
validate_at_end = true
euler_steps = [1, 4, 16]

[run]
run_training = true
resume_from_checkpoint = true
steps = 2000
seed = 987
display_every = 25
log_every = 5
run_id = "energy_to_image_energy_bank"
checkpoint_name = "energy_to_image_energy_bank.pt"
log_name = "energy_to_image_energy_bank.sqlite"
comment = "energy-bank e2i source probe; unpaired images"
pinned = false
