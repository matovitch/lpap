[data]
batch_size = 32
bucket_count = 128
probe_count = 8

[data.energy_bank]
path = "data/encoded_energies_bank_flow_best.pt"
energies_key = "energies"


[model]
k_max = 4
hidden_dim = 256
layer_count = 12
head_count = 8

[optimizer]
learning_rate = 1.0e-3

[validation]
enabled = true
every = 100
batch_size = 256
seed = 10123
validate_at_end = true

[run]
run_training = true
resume_from_checkpoint = true
steps = 10000
seed = 123
permutation_seed = 123
display_every = 5
log_every = 1
run_id = "surrogate_synthetic"
checkpoint_name = "surrogate_c128_k4.pt"
log_name = "surrogate_c128_k4.sqlite"
comment = "legacy c128 k_max=4; renamed artifact surrogate_c128_k4.pt"
pinned = false
