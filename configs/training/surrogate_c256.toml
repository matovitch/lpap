[data]
batch_size = 32
bucket_count = 256
# Keep value_count = bucket_count * probe_count = 1024 (32x32 energy / image length).
probe_count = 4

[data.energy_bank]
path = "data/encoded_energies_ae_best.pt"
energies_key = "energies"


[model]
k_max = 4
hidden_dim = 256
layer_count = 12
head_count = 8

[optimizer]
learning_rate = 1.0e-3

[validation]
enabled = true
every = 100
batch_size = 256
seed = 10123
validate_at_end = true

[run]
run_training = true
resume_from_checkpoint = true
steps = 10000
seed = 123
permutation_seed = 256
display_every = 5
log_every = 1
run_id = "surrogate_c256"
checkpoint_name = "surrogate_c256_k4.pt"
log_name = "surrogate_c256_k4.sqlite"
comment = "legacy C=256 k_max=4; renamed artifact surrogate_c256_k4.pt"
pinned = false
