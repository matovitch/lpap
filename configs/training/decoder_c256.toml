[data]
batch_size = 32
bucket_count = 256
# Match surrogate: value_count = 256 * 4 = 1024.
probe_count = 4

[decoder]
frontend_initial_temperature = 0.25
hidden_dim = 256
layer_count = 8
head_count = 8

[optimizer]
learning_rate = 1.0e-3

[validation]
enabled = true
every = 100
batch_size = 256
seed = 20123
validate_at_end = true

[teacher]
checkpoint_name = "surrogate_c256.pt"
load_best = true
require_checkpoint = true

[regularization]
source_ce_weight = 0.1
source_ce_l1_reference = 0.05
source_ce_power = 2.0

[run]
run_training = true
resume_from_checkpoint = true
steps = 10000
seed = 456
permutation_seed = 256
display_every = 5
log_every = 1
run_id = "decoder_c256"
checkpoint_name = "decoder_c256.pt"
log_name = "decoder_c256.sqlite"
comment = "C=256 decoder; probe_count=4 so value_count=1024"
pinned = false
