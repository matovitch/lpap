# C=512 LPAP surrogate on harmonics; k_max=32.
# value_count = 512 * 2 = 1024.

[data]
batch_size = 32
bucket_count = 512
probe_count = 2

[data.harmonics]
harmonic_count = 32
gain_variance = 1.0
gain_half_life = 4.0
spikiness_range = [4.0, 6.0]
dtype = "torch.float32"

[model]
k_max = 32
hidden_dim = 256
layer_count = 12
head_count = 8

[optimizer]
learning_rate = 1.0e-3

[validation]
enabled = true
every = 100
batch_size = 256
seed = 10123
validate_at_end = true

[run]
run_training = true
resume_from_checkpoint = true
steps = 15000
seed = 123
permutation_seed = 512
display_every = 5
log_every = 1
run_id = "surrogate_c512_k32"
checkpoint_name = "surrogate_c512_k32.pt"
log_name = "surrogate_c512_k32.sqlite"
comment = "C=512 harmonics surrogate; k_max=32; N=1024"
pinned = false
