[image]
dataset_path = "data/images_32x32_gray.pt"
batch_size = 32
side = 32
normalize = true
shuffle = true
num_workers = 0

[source]
surrogate_checkpoint_name = "surrogate_c128_k4.pt"
decoder_checkpoint_name = "decoder_c128_k4.pt"
image_to_energy_checkpoint_name = "image_to_energy.pt"
energy_to_image_checkpoint_name = "energy_to_image.pt"
load_best = true
require_checkpoints = true
train_image_to_energy_flow = true
train_surrogate = true
train_decoder = true
train_energy_to_image_flow = true

[image_to_energy_flow]
sequence_length = 1024
width = 128
time_dim = 128
dilation_cycles = 2
dilations = [1, 2, 4, 8, 16, 32, 64, 128]
kernel_size = 3
zero_init_output = true

[energy_to_image_flow]
sequence_length = 1024
width = 128
time_dim = 128
dilation_cycles = 2
dilations = [1, 2, 4, 8, 16, 32, 64, 128]
kernel_size = 3
zero_init_output = true

[integration]
image_to_energy_steps = 16
energy_to_image_steps = 16

[loss]
image_l2_weight = 1.0
energy_l1_weight = 0.5
surrogate_teacher_weight = 0.05
signed_mass_balance_weight = 0.02
signed_mass_floor_tau = 0.01
signed_mass_floor_coef = 1.0
detach_energy_target = false

[optimizer]
learning_rate = 2.0e-5
max_grad_norm = 1.0

[validation]
enabled = true
every = 50
batch_size = 32
seed = 60123
validate_at_end = true
euler_steps = [16]

[run]
run_training = true
resume_from_checkpoint = true
steps = 20000
seed = 2987
display_every = 5
log_every = 1
run_id = "image_autoencoder"
checkpoint_name = "image_autoencoder.pt"
log_name = "image_autoencoder.sqlite"
comment = "16-step e2e AE with dialed lambdas and signed-mass"
pinned = false
