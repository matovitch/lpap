[image]
dataset_path = "data/images_32x32_gray.pt"
# Was 32; 4x batch for GPU throughput (steps / 4, LR x sqrt(4)).
batch_size = 128
side = 32
normalize = true
shuffle = true
num_workers = 0

[source]
flow_checkpoint_name = "image_energy_flow.pt"
load_best = true
require_checkpoints = true
train_image_to_energy_flow = true
train_surrogate = true
train_decoder = true
train_energy_to_image_flow = true
lpap_frontend_mode = "surrogate"
init_checkpoint_name = ""
use_triton = false

[[source.lpap_pairs]]
name = "c128_k16"
surrogate_checkpoint_name = "surrogate_c128_k16-v2.pt"
decoder_checkpoint_name = "decoder_c128_k16-v2.pt"

[[source.lpap_pairs]]
name = "c256_k24"
surrogate_checkpoint_name = "surrogate_c256_k24-v2.pt"
decoder_checkpoint_name = "decoder_c256_k24-v2.pt"

[[source.lpap_pairs]]
name = "c512_k32"
surrogate_checkpoint_name = "surrogate_c512_k32-v2.pt"
decoder_checkpoint_name = "decoder_c512_k32-v2.pt"

[image_to_energy_flow]
sequence_length = 1024
width = 128
time_dim = 128
dilation_cycles = 2
dilations = [1, 2, 4, 8, 16, 32, 64, 128]
kernel_size = 3
zero_init_output = true

[energy_to_image_flow]
sequence_length = 1024
width = 128
time_dim = 128
dilation_cycles = 2
dilations = [1, 2, 4, 8, 16, 32, 64, 128]
kernel_size = 3
zero_init_output = true

[integration]
image_to_energy_steps = 4
energy_to_image_steps = 4

[loss]
image_l2_weight = 1.0
energy_l1_weight = 0.05
surrogate_teacher_weight = 0.05
decoder_source_ce_weight = 0.0
signed_mass_balance_weight = 0.01
signed_mass_floor_tau = 0.1
signed_mass_floor_coef = 1.0
detach_energy_target = false
detach_surrogate_ce_inputs = false
energy_l1_target = "dense"

[optimizer]
# Was 2.0e-5 @ bs32; sqrt batch scaling.
learning_rate = 4.0e-5
max_grad_norm = 1.0

[validation]
enabled = true
every = 250
batch_size = 32
num_batches = 8
seed = 60123
validate_at_end = true
euler_steps = [4]

[run]
run_training = true
resume_from_checkpoint = true
# Was 70000 @ bs32; same sample count (2.24M) at bs128.
steps = 17500
seed = 2987
display_every = 25
log_every = 5
run_id = "image_autoencoder_tri_lnorm-v2"
checkpoint_name = "image_autoencoder_tri_lnorm-v2.pt"
log_name = "image_autoencoder_tri_lnorm-v2.sqlite"
comment = "tri-pair AE c128_k16+c256_k24+c512_k32 (v2 local logits); bidirectional flow clone at init"
pinned = true
