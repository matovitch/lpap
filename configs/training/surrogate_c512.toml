# C=512 LPAP surrogate on AE energy bank (AE best@61700 encode).
# value_count = bucket_count * probe_count = 1024.

[data]
batch_size = 32
bucket_count = 512
probe_count = 2
kind = "energy_bank"

[data.energy_bank]
path = "data/encoded_energies_ae_best.pt"
energies_key = "energies"

[model]
k_max = 4
hidden_dim = 256
layer_count = 12
head_count = 8

[optimizer]
learning_rate = 1.0e-3

[validation]
enabled = true
every = 100
batch_size = 256
seed = 10123
validate_at_end = true

[run]
run_training = true
resume_from_checkpoint = true
steps = 10000
seed = 123
permutation_seed = 512
display_every = 5
log_every = 1
run_id = "surrogate_c512"
checkpoint_name = "surrogate_c512.pt"
log_name = "surrogate_c512.sqlite"
comment = "C=512 surrogate on AE@61700 energy bank; probe_count=2 so N=1024"
pinned = false
