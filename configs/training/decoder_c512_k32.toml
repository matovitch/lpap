# C=512 LPAP decoder; teacher = surrogate_c512_k32.

[data]
batch_size = 32
bucket_count = 512
probe_count = 2

[data.energy_bank]
path = "data/encoded_energies_bank_flow_best.pt"
energies_key = "energies"

[decoder]
frontend_initial_temperature = 0.25
hidden_dim = 256
layer_count = 8
head_count = 8

[optimizer]
learning_rate = 1.0e-3

[validation]
enabled = true
every = 100
batch_size = 256
seed = 20123
validate_at_end = true

[teacher]
checkpoint_name = "surrogate_c512_k32.pt"
load_best = true
require_checkpoint = true

[regularization]
source_ce_weight = 0.1
source_ce_l1_reference = 0.05
source_ce_power = 2.0

[run]
run_training = true
resume_from_checkpoint = true
steps = 15000
seed = 456
permutation_seed = 512
display_every = 5
log_every = 1
run_id = "decoder_c512_k32"
checkpoint_name = "decoder_c512_k32.pt"
log_name = "decoder_c512_k32.sqlite"
comment = "C=512 energy-bank decoder; teacher k_max=32; N=1024"
pinned = false
