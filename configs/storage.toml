# Project Hugging Face storage settings (buckets + local archive paths).
# Required under <project_root>/configs/storage.toml (no packaged default).
# On molab, copy this file to /marimo/configs/storage.toml once.
# Override buckets at runtime with LPAP_ARTIFACTS_BUCKET / LPAP_IMAGES_BUCKET.

[artifacts]
bucket = "matovitch/lpap-molab-artifacts"

[images]
bucket = "matovitch/lpap-images"
remote_zst = "images_32x32_gray.pt.zst"
local_pt = "data/images_32x32_gray.pt"
local_zst = "data/images_32x32_gray.pt.zst"

[auth]
token_files = [".hf_token", "/marimo/.hf_token"]
