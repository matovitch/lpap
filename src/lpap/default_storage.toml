# Project Hugging Face storage defaults (buckets + local archive paths).
# Override per-checkout by editing this file, or set LPAP_ARTIFACTS_BUCKET /
# LPAP_IMAGES_BUCKET. Packaged copy: lpap/default_storage.toml (molab fallback).

[artifacts]
bucket = "matovitch/lpap-molab-artifacts"

[images]
bucket = "matovitch/lpap-images"
remote_zst = "images_32x32_gray.pt.zst"
local_pt = "data/images_32x32_gray.pt"
local_zst = "data/images_32x32_gray.pt.zst"

[auth]
token_files = [".hf_token", "/marimo/.hf_token"]
